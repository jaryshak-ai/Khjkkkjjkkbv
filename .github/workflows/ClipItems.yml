name: Build EclipsClipItems

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create project files
        run: |
          mkdir -p build/src/main/java/ru/eclips/clipitems build/src/main/resources build/pack/textures/items
          cat > build/pom.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>ru.eclips</groupId>
              <artifactId>EclipsClipItems</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>
              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <repositories>
                  <repository>
                      <id>lanink</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
              <build>
                  <finalName>EclipsClipItems-${project.version}</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF_FILE
          cat > build/src/main/resources/plugin.yml <<'EOF_FILE'
          name: EclipsClipItems
          main: ru.eclips.clipitems.EclipsClipItems
          version: "1.0.0"
          api: ["1.0.0"]
          author: jaryshak
          description: Custom items "Clips" - right click adds clips to balance (EclipsClips)
          softdepend: [EclipsClips]

          commands:
            giveclip:
              description: Give clip items (ids 1-6)
              usage: /giveclip <nick> <id 1-6> [count]
              permission: eclipsclipitems.admin

          permissions:
            eclipsclipitems.admin:
              description: Give clip items
              default: op
          EOF_FILE
          cat > build/src/main/resources/config.yml <<'EOF_FILE'
          # EclipsClipItems
          # Сколько клипсов даёт предмет с id 1, 2, 3, 4, 5, 6 (ровно 6 чисел, по порядку).
          # После изменения нужен перезапуск сервера (значение входит в название предмета).
          values: [50, 100, 150, 200, 500, 1000]
          EOF_FILE
          cat > build/pack/manifest.json <<'EOF_FILE'
          {
            "format_version": 2,
            "header": {
              "name": "EclipsClipItems",
              "description": "Textures for clip items",
              "uuid": "868ad214-03c8-4b6b-a14d-fd44c35f97ea",
              "version": [1, 0, 0],
              "min_engine_version": [1, 16, 0]
            },
            "modules": [
              {
                "type": "resources",
                "description": "Textures for clip items",
                "uuid": "30fa33e1-b98b-4252-8397-8e327b3eb634",
                "version": [1, 0, 0]
              }
            ]
          }
          EOF_FILE
          cat > build/pack/textures/item_texture.json <<'EOF_FILE'
          {
            "resource_pack_name": "eclips-clipitems",
            "texture_name": "atlas.items",
            "texture_data": {
              "clips_coin": {
                "textures": "textures/items/clips_coin"
              }
            }
          }
          EOF_FILE
          cat > build/src/main/java/ru/eclips/clipitems/ClipItem.java <<'EOF_FILE'
          package ru.eclips.clipitems;

          import cn.nukkit.item.customitem.CustomItemDefinition;
          import cn.nukkit.item.customitem.ItemCustom;

          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;

          /**
           * Предмет "Клипсы". Шесть вариантов (id 1-6) с одной текстурой clips_coin.
           * Сколько клипсов даёт предмет, берётся из EclipsClipItems.VALUES (config.yml).
           */
          public abstract class ClipItem extends ItemCustom {

              public static final String TEXTURE = "clips_coin";

              private final int clipIndex;

              protected ClipItem(int index) {
                  super("eclips:clips_" + (index + 1), "§d" + EclipsClipItems.VALUES[index] + " клипсов", TEXTURE);
                  this.clipIndex = index;
              }

              /** Номер варианта 1-6. */
              public int getClipId() {
                  return clipIndex + 1;
              }

              /** Сколько клипсов зачислит предмет. */
              public int getClips() {
                  return EclipsClipItems.VALUES[clipIndex];
              }

              /**
               * Категория креатива называется по-разному в разных версиях Nukkit-MOT, поэтому
               * simpleBuilder вызывается через reflection и тип категории не указывается в коде.
               */
              @Override
              public CustomItemDefinition getDefinition() {
                  try {
                      for (Method m : CustomItemDefinition.class.getMethods()) {
                          if (!m.getName().equals("simpleBuilder") || !Modifier.isStatic(m.getModifiers())) continue;
                          Class<?>[] pt = m.getParameterTypes();
                          Object builder;
                          if (pt.length == 1) {
                              builder = m.invoke(null, this);
                          } else if (pt.length == 2) {
                              Object cat = null;
                              if (pt[1].isEnum()) {
                                  Object[] cs = pt[1].getEnumConstants();
                                  for (Object c : cs) {
                                      if (((Enum<?>) c).name().equalsIgnoreCase("ITEMS")) cat = c;
                                  }
                                  if (cat == null && cs.length > 0) cat = cs[0];
                              } else {
                                  try {
                                      Field f = pt[1].getField("ITEMS");
                                      cat = f.get(null);
                                  } catch (NoSuchFieldException ignored) {
                                  }
                              }
                              if (cat == null) continue;
                              builder = m.invoke(null, this, cat);
                          } else {
                              continue;
                          }
                          try {
                              builder.getClass().getMethod("texture", String.class).invoke(builder, TEXTURE);
                          } catch (NoSuchMethodException ignored) {
                          }
                          return (CustomItemDefinition) builder.getClass().getMethod("build").invoke(builder);
                      }
                  } catch (Throwable t) {
                      throw new RuntimeException("Не удалось создать определение предмета клипсов", t);
                  }
                  throw new IllegalStateException("CustomItemDefinition.simpleBuilder не найден");
              }

              /** Создать предмет по индексу 0..5, иначе null. */
              public static ClipItem create(int index) {
                  switch (index) {
                      case 0: return new C1();
                      case 1: return new C2();
                      case 2: return new C3();
                      case 3: return new C4();
                      case 4: return new C5();
                      case 5: return new C6();
                      default: return null;
                  }
              }

              public static class C1 extends ClipItem {
                  public C1() {
                      super(0);
                  }
              }

              public static class C2 extends ClipItem {
                  public C2() {
                      super(1);
                  }
              }

              public static class C3 extends ClipItem {
                  public C3() {
                      super(2);
                  }
              }

              public static class C4 extends ClipItem {
                  public C4() {
                      super(3);
                  }
              }

              public static class C5 extends ClipItem {
                  public C5() {
                      super(4);
                  }
              }

              public static class C6 extends ClipItem {
                  public C6() {
                      super(5);
                  }
              }
          }
          EOF_FILE
          cat > build/src/main/java/ru/eclips/clipitems/EclipsClipItems.java <<'EOF_FILE'
          package ru.eclips.clipitems;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.player.PlayerInteractEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.item.Item;
          import cn.nukkit.plugin.Plugin;
          import cn.nukkit.plugin.PluginBase;

          import java.io.File;
          import java.io.InputStream;
          import java.lang.reflect.Method;
          import java.nio.file.Files;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;

          /**
           * EclipsClipItems: кастомные предметы "Клипсы" (id 1-6).
           * ПКМ по предмету: клипсы зачисляются на баланс (плагин EclipsClips), предмет тратится.
           * Админ-команда: /giveclip <ник> <id 1-6> [кол-во]
           *
           * Ресурспак с текстурой лежит внутри jar и сам копируется в resource_packs при первом запуске.
           */
          public class EclipsClipItems extends PluginBase implements Listener {

              public static final String PERM_ADMIN = "eclipsclipitems.admin";
              public static final String PREFIX = "§d[Клипсы]§r ";
              private static final String PACK_RESOURCE = "EclipsClipItemsPack.zip";
              private static final String PACK_FILE = "EclipsClipItems.mcpack";
              private static final long USE_DELAY_MS = 300L;

              /** Сколько клипсов даёт предмет 1..6 (заполняется из config.yml в onLoad). */
              static final int[] VALUES = {50, 100, 150, 200, 500, 1000};

              private final Map<UUID, Long> lastUse = new HashMap<>();

              // ------------------------------------------------------------------ жизненный цикл

              @Override
              public void onLoad() {
                  saveDefaultConfig();
                  try {
                      List<Integer> list = getConfig().getIntegerList("values");
                      if (list != null && list.size() == VALUES.length) {
                          for (int i = 0; i < VALUES.length; i++) {
                              Integer v = list.get(i);
                              if (v != null && v > 0) VALUES[i] = v;
                          }
                      } else {
                          getLogger().warning("config.yml: values должен содержать ровно " + VALUES.length + " чисел, беру значения по умолчанию");
                      }
                  } catch (Throwable t) {
                      getLogger().error("Не удалось прочитать config.yml: " + t);
                  }

                  installPack();

                  // Кастомные предметы нужно регистрировать до старта сервера
                  List<Class<? extends ClipItem>> classes = new ArrayList<>();
                  classes.add(ClipItem.C1.class);
                  classes.add(ClipItem.C2.class);
                  classes.add(ClipItem.C3.class);
                  classes.add(ClipItem.C4.class);
                  classes.add(ClipItem.C5.class);
                  classes.add(ClipItem.C6.class);
                  for (Class<? extends ClipItem> c : classes) {
                      try {
                          Item.registerCustomItem(c);
                      } catch (Throwable t) {
                          getLogger().error("Не удалось зарегистрировать " + c.getSimpleName() + ": " + t);
                      }
                  }
              }

              @Override
              public void onEnable() {
                  getServer().getPluginManager().registerEvents(this, this);
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < VALUES.length; i++) {
                      if (i > 0) sb.append(", ");
                      sb.append(i + 1).append("=").append(VALUES[i]);
                  }
                  getLogger().info("EclipsClipItems включён. Предметы (id=клипсы): " + sb);
                  if (getServer().getPluginManager().getPlugin("EclipsClips") == null) {
                      getLogger().warning("Плагин EclipsClips не найден: предметы нельзя будет использовать, пока он не установлен.");
                  }
              }

              /** Кладёт ресурспак с текстурой в resource_packs. Если файл новый или изменился, нужен перезапуск. */
              private void installPack() {
                  try (InputStream in = getResource(PACK_RESOURCE)) {
                      if (in == null) {
                          getLogger().error("В jar нет ресурспака " + PACK_RESOURCE);
                          return;
                      }
                      byte[] data = in.readAllBytes();
                      File dir = new File(getServer().getDataPath(), "resource_packs");
                      dir.mkdirs();
                      File out = new File(dir, PACK_FILE);
                      if (out.exists() && out.length() == data.length) return;
                      Files.write(out.toPath(), data);
                      getLogger().warning("Ресурспак с текстурой клипсов установлен в resource_packs/" + PACK_FILE
                              + ". ПЕРЕЗАПУСТИТЕ сервер один раз, чтобы он заработал.");
                  } catch (Throwable t) {
                      getLogger().error("Не удалось установить ресурспак: " + t);
                  }
              }

              // ------------------------------------------------------------------ использование предмета

              @EventHandler
              public void onInteract(PlayerInteractEvent e) {
                  PlayerInteractEvent.Action a = e.getAction();
                  if (a != PlayerInteractEvent.Action.RIGHT_CLICK_AIR && a != PlayerInteractEvent.Action.RIGHT_CLICK_BLOCK) return;
                  Item used = e.getItem();
                  if (!(used instanceof ClipItem)) return;

                  // предмет не должен ничего ставить/открывать
                  e.setCancelled(true);

                  Player p = e.getPlayer();
                  long now = System.currentTimeMillis();
                  Long last = lastUse.get(p.getUniqueId());
                  if (last != null && now - last < USE_DELAY_MS) return; // клиент шлёт ПКМ дважды
                  lastUse.put(p.getUniqueId(), now);

                  Item hand = p.getInventory().getItemInHand();
                  if (!(hand instanceof ClipItem)) return;
                  int amount = ((ClipItem) hand).getClips();

                  if (!credit(p.getName(), amount)) {
                      p.sendMessage(PREFIX + "§cНе удалось зачислить клипсы. Предмет не потрачен, сообщите администрации.");
                      return;
                  }

                  if (hand.getCount() <= 1) {
                      p.getInventory().setItemInHand(Item.get(Item.AIR));
                  } else {
                      hand.setCount(hand.getCount() - 1);
                      p.getInventory().setItemInHand(hand);
                  }

                  long bal = balance(p.getName());
                  p.sendMessage(PREFIX + "§aВы получили §d" + amount + "§a клипсов."
                          + (bal >= 0 ? " Баланс: §d" + bal : ""));
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  lastUse.remove(e.getPlayer().getUniqueId());
              }

              // ------------------------------------------------------------------ связь с EclipsClips (через reflection, без зависимости при сборке)

              private boolean credit(String name, long amount) {
                  try {
                      Plugin pl = getServer().getPluginManager().getPlugin("EclipsClips");
                      if (pl == null || !pl.isEnabled()) return false;
                      Method m = pl.getClass().getMethod("addClips", String.class, long.class);
                      Object r = m.invoke(pl, name, amount);
                      return r instanceof Boolean && (Boolean) r;
                  } catch (Throwable t) {
                      getLogger().error("Не удалось зачислить клипсы игроку " + name + ": " + t);
                      return false;
                  }
              }

              /** -1 если баланс получить не удалось. */
              private long balance(String name) {
                  try {
                      Plugin pl = getServer().getPluginManager().getPlugin("EclipsClips");
                      if (pl == null || !pl.isEnabled()) return -1L;
                      Method m = pl.getClass().getMethod("getClips", String.class);
                      Object r = m.invoke(pl, name);
                      return r instanceof Number ? ((Number) r).longValue() : -1L;
                  } catch (Throwable t) {
                      return -1L;
                  }
              }

              // ------------------------------------------------------------------ команда

              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!cmd.getName().toLowerCase(Locale.ROOT).equals("giveclip")) return false;
                  if (!sender.hasPermission(PERM_ADMIN)) {
                      sender.sendMessage(PREFIX + "§cНет прав.");
                      return true;
                  }
                  if (args.length == 0) {
                      help(sender);
                      return true;
                  }

                  Player target;
                  int idArg;
                  if (args.length == 1) {
                      if (!(sender instanceof Player)) {
                          help(sender);
                          return true;
                      }
                      target = (Player) sender;
                      idArg = 0;
                  } else {
                      target = getServer().getPlayerExact(args[0]);
                      if (target == null) {
                          sender.sendMessage(PREFIX + "§cИгрок не в сети: " + args[0]);
                          return true;
                      }
                      idArg = 1;
                  }

                  int id = parse(args[idArg]);
                  if (id < 1 || id > VALUES.length) {
                      sender.sendMessage(PREFIX + "§cid должен быть от 1 до " + VALUES.length + ".");
                      help(sender);
                      return true;
                  }
                  int count = 1;
                  if (args.length > idArg + 1) {
                      count = parse(args[idArg + 1]);
                      if (count < 1 || count > 64) {
                          sender.sendMessage(PREFIX + "§cКоличество: от 1 до 64.");
                          return true;
                      }
                  }

                  ClipItem item = ClipItem.create(id - 1);
                  if (item == null) {
                      sender.sendMessage(PREFIX + "§cНе удалось создать предмет.");
                      return true;
                  }
                  item.setCount(count);
                  Item[] left = target.getInventory().addItem(item);
                  for (Item l : left) {
                      target.getLevel().dropItem(target, l);
                  }
                  sender.sendMessage(PREFIX + "§aВыдано §d" + count + " шт.§a предмета id " + id + " (§d" + VALUES[id - 1]
                          + "§a клипсов) игроку " + target.getName() + ".");
                  if (target != sender) {
                      target.sendMessage(PREFIX + "§aВам выдали §d" + count + " шт. §a\"" + VALUES[id - 1] + " клипсов\".");
                  }
                  getLogger().info(sender.getName() + " выдал " + count + " x clips_" + id + " игроку " + target.getName());
                  return true;
              }

              private void help(CommandSender s) {
                  s.sendMessage(PREFIX + "Использование: §e/giveclip <ник> <id> [кол-во]§r (себе: §e/giveclip <id>§r)");
                  for (int i = 0; i < VALUES.length; i++) {
                      s.sendMessage("§7 id " + (i + 1) + " §f= §d" + VALUES[i] + " клипсов");
                  }
              }

              private static int parse(String s) {
                  try {
                      return Integer.parseInt(s.trim());
                  } catch (Exception e) {
                      return -1;
                  }
              }
          }
          EOF_FILE
          base64 -d > build/pack/textures/items/clips_coin.png <<'EOF_B64'
          
          EOF_B64
          (cd build/pack && python3 -m zipfile -c ../src/main/resources/EclipsClipItemsPack.zip manifest.json textures)
          python3 -m zipfile -l build/src/main/resources/EclipsClipItemsPack.zip

      - name: Build jar
        run: mvn -B -f build/pom.xml package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: EclipsClipItems
          path: build/target/EclipsClipItems-1.0.0.jar
